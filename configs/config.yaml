# PredictOps central configuration.
# Every script reads values from here instead of hard-coding them, so a change
# (e.g. a window size) is made once and is recorded with each experiment.

project:
  name: PredictOps
  random_seed: 42

paths:
  raw_csv: data/raw/MetroPT3(AirCompressor).csv
  raw_pdf: data/raw/Data Description_Metro.pdf
  intermediate_dir: data/intermediate
  processed_dir: data/processed
  train_dir: data/train
  validation_dir: data/validation
  test_dir: data/test
  sample_dir: data/sample
  models_dir: models
  reports_dir: reports
  figures_dir: reports/figures
  database_url: sqlite:///database/predictops.db

dataset:
  timestamp_column: timestamp
  index_column_raw: "Unnamed: 0"   # pandas name for the unnamed first CSV column
  analog_sensors: [TP2, TP3, H1, DV_pressure, Reservoirs, Oil_temperature, Motor_current]
  digital_sensors: [COMP, DV_eletric, Towers, MPG, LPS, Pressure_switch, Oil_level, Caudal_impulses]
  # Measured in the CSV (NOT the 1 Hz stated in the PDF) — see docs/01_dataset_inspection.md
  nominal_sampling_seconds: 10
  # A time gap larger than this splits the series into independent segments.
  # Rolling features / sequences never cross a segment boundary.
  segment_gap_seconds: 600

# Failure windows copied verbatim from the official PDF ("Failure Information").
# These are the ONLY ground-truth failure information available.
failure_events:
  - {id: 1, start: "2020-04-18 00:00:00", end: "2020-04-18 23:59:00", type: Air leak, severity: High stress, report: ""}
  - {id: 2, start: "2020-05-29 23:30:00", end: "2020-05-30 06:00:00", type: Air leak, severity: High stress, report: "Maintenance on 30Apr at 12:00"}
  - {id: 3, start: "2020-06-05 10:00:00", end: "2020-06-07 14:30:00", type: Air leak, severity: High stress, report: "Maintenance on 8Jun at 16:00"}
  - {id: 4, start: "2020-07-15 14:30:00", end: "2020-07-15 19:00:00", type: Air leak, severity: High stress, report: "Maintenance on 16Jul at 00:00"}

# Target definitions (docs/03_preprocessing.md)
targets:
  # y_warn_{H}h: a reported failure starts within the next H hours.
  # Hours, not days: EDA found no multi-day precursor (docs/02 §5, §9).
  warning_horizons_hours: [2, 6, 12]

# Chronological splits (docs/03_preprocessing.md)
splits:
  validation_start: "2020-05-21 00:00:00"   # after event 1 + unreported May episodes, before event 2
  test_start: "2020-07-01 00:00:00"         # event 4 (15 Jul) is the untouched test event
  embargo_hours: 12                         # = longest warning horizon

# Equipment health & risk engine (docs/07_health_engine.md). Heuristic, not a probability.
health_engine:
  weights: {anomaly: 0.40, detector: 0.30, sensors: 0.20, history: 0.10}   # sum = 1
  cutoffs: {healthy_min: 75, warning_min: 45}
  sensor_saturation: 4          # this many out-of-range checks = full sensor penalty
  alert_min_minutes: 10         # persistent anomaly rule: >=10 flagged min ...
  alert_window_minutes: 30      # ... in the trailing 30 min
